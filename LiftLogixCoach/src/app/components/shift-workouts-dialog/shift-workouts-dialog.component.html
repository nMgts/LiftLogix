<h2 mat-dialog-title>Przesuń treningi</h2>
<form [formGroup]="shiftForm" (ngSubmit)="shiftWorkouts()" mat-dialog-content>
  <mat-form-field appearance="outline">
    <mat-label>Data początkowa</mat-label>
    <input matInput type="date" formControlName="startDate" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Data końcowa</mat-label>
    <input matInput type="date" formControlName="endDate" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Przesunięcie (dni)</mat-label>
    <input matInput type="number" formControlName="shiftDays" />
  </mat-form-field>

  <mat-dialog-actions>
    <button mat-raised-button color="primary" (click)="dialogRef.close()">Anuluj</button>
    <button mat-raised-button color="accent" type="submit" [disabled]="shiftForm.invalid">
      Zatwierdź
    </button>
  </mat-dialog-actions>
</form>
